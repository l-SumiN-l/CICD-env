name: cicd-env

services:

  test:
    image: nginx:alpine

    container_name: cicd-env-test

    restart: "no"

    environment:
      TZ: ${TZ}

    volumes:
      - test-data:/usr/share/nginx/html

    networks:
      - cicd-env-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


networks:

  cicd-env-network:
    name: cicd-env-network
    driver: bridge


volumes:

  test-data:
    name: cicd-env-test-data